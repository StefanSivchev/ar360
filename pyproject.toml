[project]
name = "ar360"
version = "0.1.0"
description = "Order to cash ELT pipeline using: S3, Snowflake, Python, Airflow and Terraform"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "numpy",
    "boto3",
    "pandera",
    "snowflake-connector-python[pandas]",
    "pydantic-settings",
    "structlog",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "sqlfluff",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]